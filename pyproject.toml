[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footnote"
version = "0.1.0"
description = "RAG over SEC filings, evaluated on FinanceBench"
requires-python = ">=3.11"
# Runtime dependencies are listed per environment (requirements.txt for eval/ingest,
# web/requirements.txt for the serverless demo), so installing this package pulls in none.
dependencies = []

[tool.setuptools]
packages = ["footnote"]
